<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="card welcome-card">
    <span class="badge">Logged In</span>
    <h1>Hello,</h1>

    <p class="username">{{username}}</p>

    <p style="color:#757575; margin-top:1rem; font-size:0.9rem;">
      You are now logged in. No session was created for this visit.
    </p>

    <div class="link-row" style="margin-top:1.5rem;">
      <a href="/login">Log out (return to login)</a>
    </div>
  </div>
</body>
</html>
