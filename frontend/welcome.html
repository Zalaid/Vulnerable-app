<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="logo-header">
    <img src="/images/datasciene-logo.jpg" alt="Datascience Logo">

  </div>

</html>
